<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>BK Blog</title>
</head>
<body>
    <section class="form-section">
        <h1>Hey Beautiful</h1>
        <h2 id="formTitle">Create New Post</h2>
            <form id="postForm">
                <div class="form-group">
                    <label for="postTitle">Post Title</label>
                    <input type="text" id="postTitle" placeholder="What's up gorgeous...?" minlength="3" required>
                    <span id="titleError" class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="postContent">Post Content</label>
                    <textarea id="postContent" placeholder="Whats on your mind..?" minlength="10" required></textarea>
                    <span id="contentError" class="error-message"></span>
                </div>

                <div>
                    <button type="submit" class="image-btn" id="submitBtn"></button>
                        <img src="https://64.media.tumblr.com/cd9aea913daabbc0461a8af7c8e6b58a/d0c9662391bde33e-fc/s75x75_c1/e769b5a4cd9420175d26d6393d6c62920eb6a962.gifv" alt="Button">
                    <button type="button" class= "img-btn-secondary" id="cancelBtn"></button>
                        <img src="https://64.media.tumblr.com/1242df10952fa38db2206948c0c7cd73/4592e15047d9b7c9-f3/s75x75_c1/97ead511efab5ebfb5d30387a46c52d66288e7af.gifv" alt="Cancel Button">
                </div>
            </form>
        </section>

        <section class="posts-section">
            <h2>Your Posts</h2>
            <div id="postsContainer">
                <div class="empty-state">
                    <div style="font-size: 3rem;"></div>
                    <p>No posts yet!</p>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
